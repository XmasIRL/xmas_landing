    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(180deg, #013c50, #001428); background-size: 100% 100%;
      animation: ambient-gradient 18s ease-in-out infinite;
      background-attachment: fixed;
      background-size: contain;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
      min-height: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(45deg, rgba(255,255,255,0.12), transparent 35%),
        linear-gradient(120deg, rgba(255,255,255,0.08), transparent 40%),
        linear-gradient(200deg, rgba(255,255,255,0.10), transparent 45%),
        linear-gradient(280deg, rgba(255,255,255,0.09), transparent 38%);
      background-size: 100% 100%, 250% 250%, 280% 280%, 320% 320%;
      opacity: 0.8;
      animation: ambient-waves 18s ease-in-out infinite;
    }

    @keyframes ambient-gradient {
      0%, 100% { background-position: 50% 0%; }
      50% { background-position: 50% 100%; }
    }

    @keyframes ambient-waves {
      0% {
        background-position: 0% 0%, 0% 0%, 0% 0%, 0% 0%;
        opacity: 0.75;
      }
      25% {
        background-position: 40% 60%, 20% 80%, 60% 30%, 80% 50%;
        opacity: 0.80;
      }
      50% {
        background-position: 80% 20%, 70% 40%, 30% 70%, 50% 80%;
        opacity: 0.78;
      }
      75% {
        background-position: 20% 90%, 50% 10%, 90% 60%, 10% 30%;
        opacity: 0.82;
      }
      100% {
        background-position: 0% 0%, 0% 0%, 0% 0%, 0% 0%;
        opacity: 0.75;
      }
    }

    #snow-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .container { width: 100%; max-width: 480px; text-align: center; position: relative; z-index: 1; }
    .links { display: flex; flex-direction: column; gap: 12px; margin: 24px 0; align-items: center; }
    .cutout-link { width: 300px; min-height: 56px; display: block; position: relative; border-radius: 14px; text-decoration: none; overflow: hidden; color: transparent; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
    .cutout-link svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .cutout-link .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .divider { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 24px 0 16px; color: rgba(255,255,255,0.75); font-size: 14px; font-family: 'Segoe Script', 'Comic Sans MS', 'Brush Script MT', cursive; }

    .socials { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 24px; }

  <script>
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let mouseX = -9999;
    let mouseY = -9999;
    let touchX = -9999;
    let touchY = -9999;
    let usingTouch = false;
    let lastMouseUpdate = 0;
    let lastTouchUpdate = 0;

    const SNOWFLAKE_DENSITY = 0.000106; // snowflakes per pixel
    let snowflakes = [];

    function createSnowflakes(count) {
      return Array.from({ length: count }, () => ({
        x: 0,
        y: 0,
        r: 0,
        speed: 0,
        angle: Math.random() * Math.PI * 2,
        drift: Math.random() * 0.6 + 0.4,
        color: `rgba(255,255,255,${Math.random() * 0.5})`,
        vx: 0,
        vy: 0
      }));
    }

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      
      const targetCount = Math.round(width * height * SNOWFLAKE_DENSITY);
      
      if (snowflakes.length < targetCount) {
        snowflakes.push(...createSnowflakes(targetCount - snowflakes.length));
      } else if (snowflakes.length > targetCount) {
        snowflakes = snowflakes.slice(0, targetCount);
      }
      
      snowflakes.forEach(f => {
        f.x = Math.random() * width;
        f.y = Math.random() * height;
        f.r = Math.random() * 2.2 + 1.2;
        f.speed = Math.random() * 0.9 + 0.5;
        f.vx = 0;
        f.vy = 0;
      });
    }

    function getInteractionPos() {
      const now = performance.now();
      const interactionActive = usingTouch ? (now - lastTouchUpdate < 150) : (now - lastMouseUpdate < 150);
      return interactionActive ? (usingTouch ? { x: touchX, y: touchY } : { x: mouseX, y: mouseY }) : { x: -9999, y: -9999 };
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);
      const interactionPos = getInteractionPos();
      
      snowflakes.forEach(f => {
        // Calculate distance to mouse/touch
        const dx = f.x - interactionPos.x;
        const dy = f.y - interactionPos.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const windRadius = 120;
        
        // Apply wind force if within radius
        if (distance < windRadius && distance > 0) {
          const force = (1 - distance / windRadius) * 1.8;
          const angle = Math.atan2(dy, dx);
          f.vx += Math.cos(angle) * force;
          f.vy += Math.sin(angle) * force;
        }
        
        // Apply friction/damping to velocity
        f.vx *= 0.94;
        f.vy *= 0.94;
        
        // Update position with velocity and natural movement
        f.y += f.speed + f.vy;
        f.x += Math.sin(f.angle) * f.drift + f.vx;
        f.angle += 0.01;
        
        // Wrap around edges
        if (f.y > height + 10) {
          f.y = -10;
          f.x = Math.random() * width;
          f.vx = 0;
          f.vy = 0;
        }
        if (f.x > width + 10) {
          f.x = -10;
        } else if (f.x < -10) {
          f.x = width + 10;
        }
        
        // Draw snowflake        
        const size = 4.8 + f.r * 1.3;
        ctx.strokeStyle = f.color;
        ctx.lineWidth = Math.max(3.2, 4.8 + (f.r * 0.6));
        ctx.beginPath();
        ctx.moveTo(f.x - size, f.y);
        ctx.lineTo(f.x + size, f.y);
        ctx.moveTo(f.x, f.y - size);
        ctx.lineTo(f.x, f.y + size);
        ctx.stroke();
      });
      requestAnimationFrame(drawSnow);
    }

      
    // Mouse events
    document.addEventListener('mousemove', (e) => {
      const nx = e.clientX;
      const ny = e.clientY;
      // Only update if moved (avoids continuous same-position updates)
      if (nx !== mouseX || ny !== mouseY) {
        mouseX = nx;
        mouseY = ny;
        lastMouseUpdate = performance.now();
      }
      usingTouch = false;
    });

    // Touch events
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const nx = e.touches[0].clientX;
        const ny = e.touches[0].clientY;
        if (nx !== touchX || ny !== touchY) {
          touchX = nx;
          touchY = ny;
          lastTouchUpdate = performance.now();
        }
        usingTouch = true;
      }
    }, { passive: true });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawSnow();
  </script>
</body>
</html>
