  <script>
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    const snowflakes = Array.from({ length: 90 }, () => ({
      x: 0,
      y: 0,
      r: 0,
      speed: 0,
      angle: Math.random() * Math.PI * 2,
      drift: Math.random() * 0.6 + 0.4,
      color: `rgba(255,255,255,${Math.random() * 0.3})`
    }));

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      snowflakes.forEach(f => {
        f.x = Math.random() * width;
        f.y = Math.random() * height;
        f.r = Math.random() * 2.2 + 1.2;
        f.speed = Math.random() * 0.9 + 0.5;
      });
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);
      snowflakes.forEach(f => {
        const size = f.r * 1.8;
        ctx.strokeStyle = f.color;
        ctx.lineWidth = Math.max(3, 2 + (f.r * 0.6));
        ctx.beginPath();
        ctx.moveTo(f.x - size, f.y);
        ctx.lineTo(f.x + size, f.y);
        ctx.moveTo(f.x, f.y - size);
        ctx.lineTo(f.x, f.y + size);
        ctx.stroke();
        f.y += f.speed;
        f.x += Math.sin(f.angle) * f.drift;
        f.angle += 0.01;
        if (f.y > height + 10) {
          f.y = -10;
          f.x = Math.random() * width;
        }
        if (f.x > width + 10) {
          f.x = -10;
        } else if (f.x < -10) {
          f.x = width + 10;
        }
      });
      requestAnimationFrame(drawSnow);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawSnow();
  </script>
